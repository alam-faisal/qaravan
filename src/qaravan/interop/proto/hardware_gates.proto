// Vendored, renamed copy of Phasecraft's `datacraft` schema
// (phasecraft/hardware_gates.proto, branch add-hardware-terms, PR #260),
// trimmed to just the `Gate` message and everything it transitively
// references (GateSet/HardwareSpecification/GateSequence/
// HardwareConnectivityEnum/HardwareGateset dropped -- confirmed via the
// live FileDescriptorProto that `Gate` never references them).
//
// Field numbers preserved exactly, verified directly against the installed
// datacraft==4.2.2 package's compiled descriptor (not hand-transcribed from
// the .proto source, which wasn't available on this machine) -- wire
// compatibility depends on field numbers/types, not file path or package
// name, so this parses bytes/JSON the real datacraft.Gate produces
// byte-for-byte identically.
//
// Package renamed (`qaravan_magritte_gate_schema`, not `phasecraft`) to
// avoid a protobuf global-descriptor-pool collision if a process ever has
// both this vendored copy and the real datacraft package loaded at once --
// see proposals/2026-08-14-task22-magritte-circuit-converter.md, Section 4.
//
// Qaravan depends on nothing but this file plus the generic `protobuf`
// PyPI package -- never on datacraft-the-package, git+SSH, or PhasePI.

syntax = "proto3";

package qaravan_magritte_gate_schema;

enum ZeroQubitGate {
  ZERO_QUBIT_GATE_UNSPECIFIED = 0;
  GLOBAL_PHASE = 1;  // pure e^{i*phase}*I contribution, no operation, no qubits set
}

enum OneQubitGateFixed {
  ONE_QUBIT_GATE_FIXED_UNSPECIFIED = 0;
  H = 1;
  X_GATE = 2;
  Y_GATE = 3;
  Z_GATE = 4;
  S = 5;
  Sdg = 6;
  T = 7;
  Tdg = 8;
  SX = 9;
  SXdg = 10;
}

enum OneQubitGateParameterised {
  ONE_QUBIT_GATE_PARAMETERISED_UNSPECIFIED = 0;
  Rx = 1;
  Ry = 2;
  Rz = 3;
  P = 4;
  U3 = 5;
  PhasedXZ = 6;
}

enum TwoQubitGateFixed {
  TWO_QUBIT_GATE_FIXED_UNSPECIFIED = 0;
  CZ = 1;
  ISWAP = 2;
  CX = 3;
  SWAP = 4;
  ECR = 5;
}

enum TwoQubitGateParameterised {
  TWO_QUBIT_GATE_PARAMETERISED_UNSPECIFIED = 0;
  MS = 1;
  RXX = 2;
  RYY = 3;
  RZZ = 4;
  XY = 5;
}

message OneQubitGateType {
  oneof gate {
    OneQubitGateFixed fixed = 1;
    OneQubitGateParameterised parameterised = 2;
  }
}

message TwoQubitGateType {
  oneof gate {
    TwoQubitGateFixed fixed = 1;
    TwoQubitGateParameterised parameterised = 2;
  }
}

// A single gate acting on one or more qubits.
message Gate {
  oneof gate_type {
    ZeroQubitGate zero_qubit_gate = 1;
    OneQubitGateType one_qubit_gate = 2;
    TwoQubitGateType two_qubit_gate = 3;
  }
  repeated string qubits = 4;
  optional double angle = 5;
  repeated double angles = 6;  // multi-angle gates; unused by anything AIM's compile produces
  optional double phase = 7;
}
